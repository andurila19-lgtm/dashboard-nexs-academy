<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 90" width="360" height="90">
  <defs>
    <linearGradient id="gold-grad-full" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="40%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
    <linearGradient id="red-grad-full" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FB923C" />
      <stop offset="50%" stop-color="#DC2626" />
      <stop offset="100%" stop-color="#991B1B" />
    </linearGradient>
  </defs>

  <!-- 'N' Icon -->
  <g transform="translate(10, 4) scale(0.85)">
    <rect x="18" y="16" width="30" height="72" rx="15" transform="rotate(16 18 16)" fill="url(#gold-grad-full)" />
    <rect x="54" y="12" width="30" height="72" rx="15" transform="rotate(16 54 12)" fill="url(#red-grad-full)" />
  </g>

  <!-- Text -->
  <text x="105" y="38" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="34" fill="#3B1D1D" letter-spacing="2">NEXS</text>
  <text x="105" y="62" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="18" fill="#3B1D1D">Japanese Academy</text>
  <text x="105" y="78" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="12" fill="#6B4F4F">We Make Your Japanese Up!</text>
</svg>
